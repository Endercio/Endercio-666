<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>??? // 2026</title>
    <style>
        :root { --glow: #00ff66; --bg: #020202; }
        * { margin:0; padding:0; box-sizing:border-box; cursor: none !important; }
        body { background: var(--bg); color: var(--glow); font-family: "Courier New", monospace; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        
        #endercio-final-screen {
            --timer-green: #a4ffc2;
            position: fixed;
            inset: 0;
            z-index: 2147483647;
            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
            min-height: 100svh;
            padding: clamp(14px, 4vw, 52px);
            overflow: hidden;
            color: var(--timer-green);
            background: radial-gradient(ellipse at 50% 48%, rgba(0, 255, 110, .13), transparent 60%), #010302;
        }
        .timer-container {
            text-align: center;
            border: 1px solid var(--timer-green);
            padding: 40px;
            background: rgba(0, 10, 5, 0.95);
            box-shadow: 0 0 50px rgba(0, 255, 110, 0.2);
        }
        .timer-title {
            font-size: 14px;
            letter-spacing: 6px;
            margin-bottom: 20px;
            opacity: 0.7;
        }
        #countdown {
            font-size: clamp(30px, 8vw, 70px);
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 0 0 20px var(--timer-green);
        }
    </style>
</head>
<body>
    <div id="endercio-final-screen">
        <div class="timer-container">
            <div class="timer-title">SYSTEM OFFLINE // TIME REMAINING</div>
            <div id="countdown">00:00:00:00</div>
        </div>
    </div>

    <script>
        // Ustaw docelową datę licznika (zmień poniżej w razie potrzeby)
        const targetDate = new Date("2026-12-31T23:59:59").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById("countdown").innerText = "EXPIRED";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            const pad = (n) => String(n).padStart(2, '0');
            document.getElementById("countdown").innerText = `${pad(days)}:${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
