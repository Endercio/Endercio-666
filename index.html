<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>E-N-I-O // VAULT_ULTIMATE</title>
    <style>
        :root { --glow: #00ff66; --bg: #020202; --trans: 3s; }
        .blood-mode { --glow: #ff0000 !important; background: #050000 !important; }

        * { margin:0; padding:0; box-sizing:border-box; cursor: none !important; }
        
        /* CRT VIBE & SCANLINES */
        .crt-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 9000;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%;
            opacity: 0.8;
        }
        .crt-overlay::after {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: rgba(18, 16, 16, 0.1); opacity: 0; z-index: 9001; pointer-events: none;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
        }

        #cursor {
            width: 25px; height: 25px; border: 1px solid var(--glow);
            position: fixed; pointer-events: none; z-index: 99999;
            transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center;
        }
        #cursor::before { content: ''; position: absolute; width: 100%; height: 1px; background: var(--glow); }
        #cursor::after { content: ''; position: absolute; width: 1px; height: 100%; background: var(--glow); }

        body {
            background: var(--bg); color: var(--glow); font-family: "Courier New", monospace;
            height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center;
            transition: background var(--trans), color var(--trans);
        }

        #boot-screen { position: fixed; inset: 0; background: black; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #main-ui { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; }
        
        #doom-timer { position: fixed; top: 20px; left: 20px; font-size: 18px; border: 1px solid var(--glow); padding: 5px 10px; }
        .top-right { position: fixed; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 1100; }

        .btn { font-size: 11px; border: 1px solid var(--glow); padding: 8px 15px; background: black; color: var(--glow); transition: 0.2s; text-transform: uppercase; }
        .btn:hover { background: var(--glow); color: black; box-shadow: 0 0 15px var(--glow); }

        .panel {
            position: fixed; top: 60px; right: 20px; width: 340px;
            border: 1px solid var(--glow); background: rgba(0,0,0,0.98);
            padding: 15px; display: none; z-index: 1000; font-size: 11px; line-height: 1.5;
        }

        .wrapper { width: 90%; max-width: 900px; text-align: center; }
        .title { font-size: clamp(25px, 6vw, 55px); font-weight: 900; letter-spacing: 12px; margin-bottom: 20px; text-shadow: 0 0 10px var(--glow); }

        .console {
            background: rgba(0,10,0,0.05); border: 1px solid var(--glow); padding: 15px; margin: 15px 0;
            text-align: left; font-size: 12px; height: 110px; overflow: hidden;
            display: flex; flex-direction: column; justify-content: flex-end;
        }

        .input-area { display: flex; flex-direction: column; gap: 10px; align-items: center; }
        input {
            background: transparent; border: 1px solid var(--glow); color: var(--glow);
            padding: 12px; width: 100%; max-width: 450px; font-family: inherit;
            text-align: center; outline: none; font-size: 16px; transition: border-color var(--trans);
        }
        input:disabled { opacity: 0.4; border-style: dashed; pointer-events: none; }

        #unlocked {
            display: none; border: 1px double var(--glow); padding: 25px; margin-top: 20px;
            background: rgba(0,0,0,0.9); max-height: 380px; overflow-y: auto; text-align: left;
            animation: glitchOpen 0.3s ease-out;
        }
        @keyframes glitchOpen { 0% { opacity:0; transform: scaleY(0); } 100% { opacity:1; transform: scaleY(1); } }

        .data-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; margin-top: 15px; }
        .data-box h4 { border-bottom: 1px solid var(--glow); margin-bottom: 10px; font-size: 12px; padding-bottom: 3px; }
        .track-item { padding: 4px 0; border-bottom: 1px solid rgba(0,255,100,0.1); font-size: 11px; }

        .footer { position: fixed; bottom: 10px; width: 100%; text-align: center; font-size: 10px; opacity: 0.3; }
        .hidden-date { position: fixed; bottom: 10px; left: 10px; font-size: 9px; opacity: 0.03; transition: 0.5s; }
        .hidden-date:hover { opacity: 0.8; color: #ff0000; }
    </style>
</head>
<body>

<div id="cursor"></div>
<div class="crt-overlay"></div>

<div id="boot-screen">
    <div id="lang-select">
        <h2 style="letter-spacing: 10px; margin-bottom: 30px; text-align:center;">VAULT_ACCESS</h2>
        <div style="display:flex; gap: 20px; justify-content: center;">
            <button class="btn" style="padding: 20px 40px;" onclick="startBoot('PL')">POLSKI</button>
            <button class="btn" style="padding: 20px 40px;" onclick="startBoot('EN')">ENGLISH</button>
        </div>
    </div>
    <div id="boot-loader" style="display:none; width: 350px;">
        <div id="boot-text" style="font-size: 10px; line-height: 1.6; height: 110px;"></div>
        <div style="width: 100%; height: 2px; border: 1px solid var(--glow); margin-top: 10px;"><div id="fill" style="width: 0%; height: 100%; background: var(--glow); transition: 0.1s;"></div></div>
    </div>
</div>

<div id="main-ui">
    <div id="doom-timer">666:00:00:00</div>
    <div class="hidden-date">13.12</div>

    <div class="top-right">
        <button class="btn" id="btn-usr" onclick="toggle('userPanel')"></button>
        <button class="btn" id="btn-reg" onclick="toggle('rulesPanel')"></button>
    </div>

    <div id="userPanel" class="panel">
        <h3 id="u-head"></h3><hr style="border:0; border-top:1px solid var(--glow); margin:8px 0;">
        <p id="u-id"></p>
        <p id="u-stat"></p>
        <p id="u-founder" style="margin-top:10px; font-weight: bold;"></p>
        <p id="u-threat" style="margin-top:5px; color: yellow;"></p>
    </div>

    <div id="rulesPanel" class="panel">
        <h3 id="r-head"></h3><hr style="border:0; border-top:1px solid var(--glow); margin:8px 0;">
        <div id="r-body"></div>
    </div>

    <div class="wrapper">
        <div class="title" id="m-title"></div>
        <div class="console" id="console"><div id="log"></div></div>
        
        <div class="input-area">
            <input type="text" id="cmd" placeholder="..." autocomplete="off">
            <button class="btn" id="decode-btn" onclick="execute()"></button>
        </div>

        <div id="unlocked">
            <h2 style="letter-spacing: 5px; border-left: 4px solid var(--glow); padding-left: 10px;" id="breach-msg"></h2>
            <p id="sub-msg" style="font-size: 12px; margin: 10px 0; opacity: 0.7;"></p>
            
            <div class="data-grid">
                <div class="data-box">
                    <h4 id="box-1"></h4>
                    <div id="tracklist"></div>
                </div>
                <div class="data-box">
                    <h4 id="box-2"></h4>
                    <div style="font-size: 10px; opacity: 0.6; line-height: 1.4;" id="core-logs"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer" id="f-text"></div>
</div>

<script>
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', (e) => { cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px'; });

    // AUDIO CONTEXT (Needs interaction)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type, dur) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    let lang = 'PL';
    let uID = Math.floor(Math.random() * 666) + 1;
    let doomSec = 666 * 3600;
    const tracks = ["Diss Na Marceline", "Się Spuściłem", "Ona mówi że Ble", "Nie Mam Zamiaru w to już dłużej GRAĆ", "Zaczerpnij Powietrza", "Ona mówi na mnie LightSaber", "Pale Blanta"];

    const dict = {
        PL: {
            title: "TERMINAL_E-N-I-O", uHead: "STATUS_DOSTĘPU", rHead: "PROTOKOŁY",
            rules: "1. Terminal jest własnością prywatną Założyciela.<br>2. Logowanie obecności rozpoczęte.<br>3. Nie szukaj znaczenia nazwy E-N-I-O.<br>4. Każda anomalia jest zamierzona.<br>5. Jeśli ID sesji to 666 - uciekaj.<br>6. Założyciel widzi każdą próbę błędu.<br>7. 13.12 - Prawda nadejdzie.",
            ph: "WPROWADŹ KLUCZ...", breach: "PRZEŁAMANIE_UDANE", sub: "Archiwa Endercio zostały otwarte.",
            b1: "PLIKI_MUZYCZNE", b2: "DUMP_SYSTEMOWY", threat: "ZAGROŻENIE: NISKIE", t_crit: "ZAGROŻENIE: KRYTYCZNE",
            stat: "STATUS: ŚLEDZONY", btnUsr: "[USR]", btnReg: "[REG]", founder: "ZAŁOŻYCIEL: ENDERCIO",
            logReady: "> SYSTEM GOTOWY. OCZEKIWANIE...", logBoot: ["> INICJACJA RDZENIA...", "> ŁAMANIE SZYFRU...", "> WERYFIKACJA ZAŁOŻYCIELA...", "> WITAJ, MASTER."],
            footer: "E-N-I-O // VAULT_OS // 2026", decode: "[ DESZYFRUJ ]"
        },
        EN: {
            title: "TERMINAL_E-N-I-O", uHead: "ACCESS_STATUS", rHead: "PROTOCOLS",
            rules: "1. This terminal is the Founder's property.<br>2. Presence logging has been initiated.<br>3. Do not seek the meaning of E-N-I-O.<br>4. Every anomaly is intentional.<br>5. If session ID is 666 - run.<br>6. The Founder sees every error attempt.<br>7. 13.12 - The truth is coming.",
            ph: "ENTER KEY...", breach: "BREACH_SUCCESSFUL", sub: "Endercio archives have been opened.",
            b1: "MUSIC_FILES", b2: "SYSTEM_DUMP", threat: "THREAT: MINIMAL", t_crit: "THREAT: CRITICAL",
            stat: "STATUS: TRACKED", btnUsr: "[USR]", btnReg: "[REG]", founder: "FOUNDER: ENDERCIO",
            logReady: "> SYSTEM READY. WAITING...", logBoot: ["> INITIALIZING CORE...", "> BYPASSING CIPHER...", "> VERIFYING FOUNDER...", "> WELCOME, MASTER."],
            footer: "E-N-I-O // VAULT_OS // 2026", decode: "[ DECODE ]"
        }
    };

    function startBoot(l) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        playSound(150, 'square', 0.1);
        lang = l;
        const d = dict[lang];
        document.getElementById('lang-select').style.display = 'none';
        document.getElementById('boot-loader').style.display = 'block';
        let i = 0;
        const interval = setInterval(() => {
            if(i < d.logBoot.length) {
                playSound(400 + (i*100), 'sine', 0.05);
                document.getElementById('boot-text').innerHTML += d.logBoot[i] + "<br>";
                document.getElementById('fill').style.width = ((i+1) * 25) + "%";
                i++;
            } else {
                clearInterval(interval);
                setTimeout(() => {
                    document.getElementById('boot-screen').style.display = 'none';
                    document.getElementById('main-ui').style.display = 'flex';
                    initMain();
                }, 400);
            }
        }, 500);
    }

    function initMain() {
        const d = dict[lang];
        document.getElementById('m-title').innerText = d.title;
        document.getElementById('u-head').innerText = d.uHead;
        document.getElementById('r-head').innerText = d.rHead;
        document.getElementById('r-body').innerHTML = d.rules;
        document.getElementById('cmd').placeholder = d.ph;
        document.getElementById('u-id').innerText = "SESSION_ID: " + String(uID).padStart(3, '0');
        document.getElementById('u-stat').innerText = d.stat;
        document.getElementById('u-threat').innerText = d.threat;
        document.getElementById('u-founder').innerText = d.founder;
        document.getElementById('btn-usr').innerText = d.btnUsr;
        document.getElementById('btn-reg').innerText = d.btnReg;
        document.getElementById('log').innerText = d.logReady;
        document.getElementById('f-text').innerText = d.footer;
        document.getElementById('decode-btn').innerText = d.decode;
        
        setInterval(() => {
            doomSec--;
            let h = Math.floor(doomSec / 3600);
            let m = Math.floor((doomSec % 3600) / 60);
            let s = doomSec % 60;
            document.getElementById('doom-timer').innerText = `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }, 1000);
    }

    function toggle(id) { 
        playSound(200, 'triangle', 0.1);
        const p = document.getElementById(id); 
        p.style.display = p.style.display === 'block' ? 'none' : 'block'; 
    }

    function addLog(m) {
        const l = document.getElementById('log');
        l.innerHTML += `<br>> ${m}`;
        const lines = l.innerHTML.split('<br>');
        if(lines.length > 4) l.innerHTML = lines.slice(lines.length - 4).join('<br>');
    }

    function execute() {
        const val = document.getElementById('cmd').value.toLowerCase().trim();
        playSound(300, 'square', 0.05);

        if(val === 'e666ioplay' || val === 'endercio') {
            // GLITCH SOUND
            playSound(100, 'sawtooth', 0.5);
            playSound(50, 'sawtooth', 0.8);
            
            document.body.classList.add('blood-mode');
            const input = document.getElementById('cmd');
            input.disabled = true;
            input.value = "MASTER_LOGIN";
            document.getElementById('decode-btn').style.display = 'none';
            document.getElementById('u-threat').innerText = dict[lang].t_crit;
            document.getElementById('u-threat').style.color = "red";
            
            addLog(lang === 'PL' ? "ŁĄCZENIE Z RDZENIEM..." : "CONNECTING TO CORE...");
            setTimeout(() => {
                document.getElementById('unlocked').style.display = 'block';
                document.getElementById('breach-msg').innerText = dict[lang].breach;
                document.getElementById('sub-msg').innerText = dict[lang].sub;
                document.getElementById('box-1').innerText = dict[lang].b1;
                document.getElementById('box-2').innerText = dict[lang].b2;
                
                document.getElementById('core-logs').innerHTML = lang === 'PL' ? 
                    "> SEKTOR 0x666: OTWARTY<br>> OPERATOR: ENDERCIO<br>> STATUS: KONTROLA TOTALNA<br>> SYSTEM: STABILNY<br>> WIDOCZNOŚĆ: GLOBALNA" :
                    "> SECTOR 0x666: OPEN<br>> OPERATOR: ENDERCIO<br>> STATUS: TOTAL CONTROL<br>> SYSTEM: STABLE<br>> VISIBILITY: GLOBAL";

                let h = "";
                tracks.forEach(t => h += `<div class="track-item">[PLIK]: ${t}</div>`);
                document.getElementById('tracklist').innerHTML = h;
            }, 1000);
        } else {
            addLog(lang === 'PL' ? "BŁĄD: ODMOWA DOSTĘPU" : "ERR: ACCESS DENIED");
            document.getElementById('cmd').value = '';
        }
    }
    document.getElementById('cmd').addEventListener('keypress', (e) => { if(e.key === 'Enter' && !document.getElementById('cmd').disabled) execute(); });
</script>
</body>
</html>
